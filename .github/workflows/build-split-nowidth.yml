name: build-split-nowidth

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Gradle 9.6 / AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: JDK 17 (Kotlin toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore JAVA_HOME to 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: SDK components
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin | tail -1)/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.31.6" "ndk;28.2.13676358" 2>&1 | grep -vE "^\[=*" | tail -5 || true
          echo "sdk.dir=$SDK" >> "$GITHUB_ENV"

      - name: Fetch upstream + apply patch
        run: |
          set -eux
          git clone --depth 1 https://github.com/ruzhe85/MihonSY.git src
          cd src
          patch -p1 --verbose < ../split-no-width-detect.patch
          grep -n "拆分双页不检测宽度" app/src/main/java/eu/kanade/tachiyomi/ui/reader/viewer/pager/PagerPageHolder.kt
          echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mihonsy-v1

      - name: Gradle build
        working-directory: src
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PmihonsyUniversal=true --no-daemon --stacktrace 2>&1 | tail -150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MihonSY-split-nowidth
          path: |
            src/app/build/outputs/apk/**/*.apk
            src/app/build/outputs/mapping/**/*.txt
          if-no-files-found: warn
